<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ไม่บอก</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="devBlockOverlay">
  <h1>🚫 ห้ามเข้า</h1>
  <p>ตรวจพบการเปิด Developer Tools<br>กรุณาปิด DevTools แล้วรีเฟรชหน้า</p>
</div>

<h1>🔒</h1>
<div class="card">
  <div class="question-row">
    <h2 id="question"></h2>
    <button class="copy-btn" id="copyQuestionBtn" onclick="copyQuestion()" title="คัดลอกโจทย์">📋 คัดลอก</button>
  </div>
  <input id="answer" autocomplete="off" placeholder="No ai plz '^' ">
  <button onclick="checkAnswer()">ตอบ</button>
  <p id="status"></p>
  <div>
    <button class="hint-btn" id="hintBtn" onclick="hintClick()">💡 คลิก 300 ครั้งเพื่อดูคำใบ้ <span id="hintCount">(0/300)</span></button>
    <div class="hint-progress-wrap"><div class="hint-progress-bar" id="hintBar"></div></div>
    <div class="hint-box" id="hintBox"></div>
  </div>
</div>
<div class="card">
  <h3>ชิ้นส่วนที่ปลดล็อกแล้ว</h3>
  <div id="clues"></div>
  <h5>Hint:🌐 🔄 + haha</h5>
</div>
<div id="trollArea"></div>

<script src="script.js"></script>
</body>
</html>
