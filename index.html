<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ไม่บอก</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
body{user-select:none;-webkit-user-select:none;-ms-user-select:none;}
body{
  background:#0d1117;
  color:#e6edf3;
  font-family:sans-serif;
  max-width:900px;
  margin:0 auto;
  padding:16px;
  min-height:100vh;
}
h1{font-size:clamp(1.4rem,5vw,2rem);margin:0 0 4px;}
h2{font-size:clamp(1rem,4vw,1.4rem);word-break:break-word;}
h3{font-size:clamp(0.95rem,3.5vw,1.2rem);}

.card{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:12px;
  padding:clamp(14px,4vw,24px);
  margin-top:16px;
}

input{
  width:100%;
  padding:10px 12px;
  margin-top:10px;
  background:#21262d;
  color:white;
  border:1px solid #444;
  border-radius:6px;
  font-size:1rem;
  /* prevent iOS zoom on focus (font-size must be >=16px) */
  font-size:max(16px, 1rem);
}
input:focus{outline:2px solid #58a6ff;border-color:#58a6ff;}

button{
  margin-top:10px;
  padding:10px 18px;
  background:#238636;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:1rem;
  /* tap-target: at least 44px tall on mobile */
  min-height:44px;
  touch-action:manipulation;
}
button:hover{background:#2ea043;}
button:disabled{opacity:0.5;cursor:not-allowed;}

progress{
  width:100%;
  height:12px;
  border-radius:6px;
  margin-top:10px;
}

.success{color:#3fb950;}
.error{color:#ff7b72;}

/* Copy button */
.copy-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-left:8px;
  padding:4px 10px;
  background:#21262d;
  color:#8b949e;
  border:1px solid #30363d;
  border-radius:6px;
  cursor:pointer;
  font-size:0.78rem;
  min-height:28px;
  vertical-align:middle;
  touch-action:manipulation;
  transition:color .15s,border-color .15s;
}
.copy-btn:hover{color:#e6edf3;border-color:#58a6ff;}
.copy-btn.copied{color:#3fb950;border-color:#3fb950;}

/* Question row */
.question-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;}
.question-row h2{margin:0;flex:1;min-width:0;}

/* Clue item */
.clue-item{
  background:#0d1117;
  border:1px solid #30363d;
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:10px;
}
.clue-item.locked{color:#484f58;}
.clue-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
.clue-label{font-weight:600;font-size:0.9rem;}
.clue-text{color:#58a6ff;font-size:clamp(0.85rem,3vw,1rem);word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;}

/* Runaway button container — constrain so button can't escape off-screen */
#trollArea .card{overflow:hidden;position:relative;}
#runaway{position:relative;}

/* DevTools overlay */
#devBlockOverlay{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#0d1117;
  z-index:99999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}
#devBlockOverlay h1{font-size:clamp(1.8rem,8vw,3rem);color:#ff7b72;}
#devBlockOverlay p{color:#8b949e;font-size:clamp(0.9rem,3vw,1rem);}

/* Troll: AI verification — wrap long code */
#trollArea h2{
  word-break:break-all;
  overflow-wrap:anywhere;
  font-size:clamp(0.85rem,3vw,1.4rem);
  line-height:1.5;
}

@media(max-width:480px){
  body{padding:12px 10px;}
  .card{padding:14px 12px;}
  button:not(.copy-btn){width:100%;}
}

/* Copy button — responsive overrides */
.copy-btn{
  margin-left:0;
  margin-top:0;
  min-height:36px;
  padding:6px 12px;
  font-size:clamp(0.75rem,3vw,0.85rem);
  white-space:nowrap;
}

/* Question row: keep copy-btn aligned to top-right, wraps on very small screens */
.question-row{
  align-items:flex-start;
  row-gap:6px;
}

/* Clue header copy btn — always stays right, never stretches */
.clue-header .copy-btn{
  flex-shrink:0;
}
</style>
</head>
<body>

<div id="devBlockOverlay">
  <h1>🚫 ห้ามเข้า</h1>
  <p>ตรวจพบการเปิด Developer Tools<br>กรุณาปิด DevTools แล้วรีเฟรชหน้า</p>
</div>

<h1>🔒</h1>
<div class="card">
  <div class="question-row">
    <h2 id="question"></h2>
    <button class="copy-btn" id="copyQuestionBtn" onclick="copyQuestion()" title="คัดลอกโจทย์">📋 คัดลอก</button>
  </div>
  <input id="answer" autocomplete="off">
  <button onclick="checkAnswer()">ตอบ</button>
  <p id="status"></p>
</div>
<div class="card">
  <h3>ชิ้นส่วนที่ปลดล็อกแล้ว</h3>
  <div id="clues"></div>
  <h5>Hint: 4 -> 1 haha</h5>
  <div id="hintSection" style="margin-top:14px;">
    <button id="hintBtn" onclick="hintClick()" style="background:#1f3a5f;width:100%;position:relative;overflow:hidden;padding:10px 18px;min-height:44px;border:1px solid #2a4a7f;border-radius:8px;color:#8bb4e8;font-size:0.95rem;cursor:pointer;transition:color .2s;">
      <span id="hintBtnLabel">💡 คลิก 100 ครั้งเพื่อดู Hint (<span id="hintCount">0</span>/100)</span>
      <div id="hintProgress" style="position:absolute;left:0;top:0;height:100%;width:0%;background:#1a4080;z-index:0;transition:width .1s;"></div>
      <span style="position:relative;z-index:1;" id="hintBtnInner"></span>
    </button>
    <div id="hintResult" style="display:none;margin-top:10px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 12px;">
      <div style="font-size:0.8rem;color:#8b949e;margin-bottom:4px;">💡 Hint สำหรับข้อนี้:</div>
      <div id="hintText" style="color:#e3b341;font-size:clamp(0.85rem,3vw,1rem);word-break:break-word;white-space:pre-wrap;"></div>
    </div>
  </div>
</div>
<div id="trollArea"></div>

<script>
// ── DEVTOOLS DETECTION ──
(function(){
  const ov = document.getElementById("devBlockOverlay");
  function block(){
    ov.style.display="flex";
    const troll=document.getElementById("trollArea");
    if(troll && troll.innerHTML) _savedTrollHTML=troll.innerHTML; // save before clearing
    ["question","clues","trollArea","status"].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.innerHTML="";
    });
    const a=document.getElementById("answer");
    if(a) a.value="";
  }
  function unblock(){
    ov.style.display="none";
    renderQuestion(); updateClues();
    // restore troll stage if it was showing
    const troll=document.getElementById("trollArea");
    if(troll && _savedTrollHTML) troll.innerHTML=_savedTrollHTML;
  }

  // Block keyboard shortcuts
  document.addEventListener("keydown",function(e){
    if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&/^[ijcIJC]$/.test(e.key))||(e.ctrlKey&&/^[uU]$/.test(e.key))){
      e.preventDefault(); e.stopPropagation(); block(); return false;
    }
  },true);

  document.addEventListener("contextmenu",e=>e.preventDefault());
  document.addEventListener("copy",e=>e.preventDefault());
  document.addEventListener("cut",e=>e.preventDefault());
  document.addEventListener("paste",e=>e.preventDefault());
  document.addEventListener("selectstart",e=>e.preventDefault());

  // Window size devtools detection
  const th=160;
  setInterval(function(){
    if(window.outerWidth-window.innerWidth>th||window.outerHeight-window.innerHeight>th){
      block();
    } else {
      if(ov.style.display==="flex") unblock();
    }
  },500);

  // Console open detection via debugger timing
  setInterval(function(){
    const s=performance.now();
    debugger;
    if(performance.now()-s>300) block(); // raised from 100→300ms to avoid false positives
  },1000);
})();

// ── CRYPTO ──
// Key is split and assembled at runtime so it never appears as a literal string
const _k = (()=>{ const p=["x9","Z!","mQ"]; return p.join(""); })();

function _x(s,k){
  let o="";
  for(let i=0;i<s.length;i++) o+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));
  return o;
}
function _d(s){ return _x(atob(s),_k); }

// ── STAGE DATA — no plain-text answers or clues anywhere ──
// All values are pre-encrypted; raw answers DO NOT appear in this file.
const _S=[
  {qRaw:"54 68 61 69 6C 61 6E 64",          _a:"LFE7SAEwFl0=",            _c:"SAlrEF1gSAh6EV1gSQlrEVw="},
  {qRaw:"Q2hhdEdQVA==",                      _a:"O1E7VSoBLA==",            _c:"SAlrEFxhSAl6EV1gSQlrEV0="},
  {qRaw:"01000111 01001001 01000110 01010100 01000101 01000100 00100000 01000011 01001111 01001101 01010000 01010101 01010100 01000101 01010010",
                                              _a:"P3AcdSgVWHoVbD0ELHwI",    _c:"SAhqEV1gSQl6EVxgSAlqEF0="},
  {qRaw:"FRPSXWHU",                          _a:"O3YXcTgFPWs=",            _c:"SAhrEVxhSAh6EVxhSQhqEFw="}
];

let current=0, unlocked=[], currentCode="";
let _busy=false; // global lock — prevents any function running twice at once
let _savedTrollHTML=""; // save troll stage HTML across block/unblock

function _lock(fn){
  return function(){
    if(_busy) return;
    _busy=true;
    try{ fn.apply(this,arguments); }
    catch(e){ _busy=false; throw e; } // release lock on unexpected error
  };
}
function _release(){ _busy=false; }

function renderQuestion(){
  if(current>=_S.length){
    document.getElementById("question").innerText="ภารกิจเสร็จสิ้น";
    document.getElementById("answer").style.display="none";
    return;
  }
  document.getElementById("question").innerText="ข้อ "+(current+1)+": "+_S[current].qRaw;
}
function updateClues(){
  const container=document.getElementById("clues");
  container.innerHTML="";
  for(let i=0;i<_S.length;i++){
    const div=document.createElement("div");
    if(unlocked[i]){
      const text=_d(unlocked[i]);
      div.className="clue-item";
      div.innerHTML=`<div class="clue-header"><span class="clue-label">ส่วนที่ ${i+1}</span><button class="copy-btn" onclick="copyClue(${i})" title="คัดลอก">📋 คัดลอก</button></div><div class="clue-text" id="clue-text-${i}"></div>`;
      div.querySelector(`#clue-text-${i}`).textContent=text;
    } else {
      div.className="clue-item locked";
      div.innerHTML=`<div class="clue-label">ส่วนที่ ${i+1} : [ล็อก]</div>`;
    }
    container.appendChild(div);
  }
}

function copyClue(i){
  if(!unlocked[i]) return;
  const text=_d(unlocked[i]);
  _copyText(text, document.querySelectorAll('#clues .copy-btn')[i]);
}

function copyQuestion(){
  const el=document.getElementById("question");
  if(!el||!el.textContent) return;
  _copyText(el.textContent, document.getElementById("copyQuestionBtn"));
}

function _copyText(text, btn){
  function flash(){
    if(btn){
      btn.classList.add("copied");
      btn.textContent="✓ คัดลอกแล้ว";
      setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML="📋 คัดลอก"; },1500);
    }
  }
  // navigator.clipboard bypasses the document 'copy' event block
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(flash).catch(()=>{
      _copyFallback(text); flash();
    });
  } else {
    _copyFallback(text); flash();
  }
}

function _copyFallback(text){
  const ta=document.createElement("textarea");
  ta.value=text;
  ta.style.cssText="position:fixed;opacity:0;top:0;left:0;";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
}
function normalize(s){ return s.trim().toLowerCase(); }

// ── disable/enable the main answer button ──
function setAnswerBtn(disabled){
  const btn=document.querySelector('.card button');
  if(btn) btn.disabled=disabled;
}

function checkAnswer(){
  if(_busy) return;
  const user=normalize(document.getElementById("answer").value);
  const correct=normalize(_d(_S[current]._a));
  if(user===correct){
    _busy=true;
    setAnswerBtn(true);
    startTrollStage();
  } else {
    document.getElementById("status").innerHTML="<span class='error'>คำตอบไม่ถูกต้อง</span>";
  }
}

function unlockStage(){
  unlocked[current]=_S[current]._c;
  current++;
  _resetHint();
  updateClues(); renderQuestion();
  document.getElementById("answer").value="";
  document.getElementById("status").innerHTML="<span class='success'>ปลดล็อกสำเร็จ</span>";
  document.getElementById("trollArea").innerHTML="";
  _savedTrollHTML=""; // troll stage done, clear saved state
  setAnswerBtn(false);
  _busy=false; // release lock after stage is fully done
}

function scrollToTroll(){
  setTimeout(()=>{
    const el=document.getElementById("trollArea");
    if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
  },120);
}

function startTrollStage(){
  const m=current%5;
  if(m===0)fakeAd();
  else if(m===1)fakeAI();
  else if(m===2)runawayButton();
  else if(m===3)fakeLoading();
  else codeGate();
  scrollToTroll();
}

function fakeAd(){
  let sec=60, done=false;
  document.getElementById("trollArea").innerHTML=`<div class="card"><h3>📺 โปรดรอสักครู่...</h3><p id="count">${sec}</p></div>`;
  let t=setInterval(()=>{
    sec--;
    document.getElementById("count").innerText=sec;
    if(sec<=0 && !done){ done=true; clearInterval(t); unlockStage(); }
  },1000);
}

function fakeAI(){
  generateCode();
  document.getElementById("trollArea").innerHTML=`<div class="card"><h3>🤖 AI VERIFICATION</h3><p>พิมพ์รหัสนี้:</p><h2 style="color:#ffcc00">${currentCode}</h2><input id="humanInput" placeholder="15 ตัวอักษร"><button onclick="verifyHuman()">ยืนยัน</button></div>`;
}
function verifyHuman(){
  if(document.getElementById("humanInput").value.trim()===currentCode) unlockStage();
  else alert("❌ AI DETECTED");
}

function runawayButton(){
  document.getElementById("trollArea").innerHTML=`
    <div class="card" id="runawayCard" style="min-height:200px;position:relative;">
      <h3>🎯 จับปุ่มให้ได้</h3>
      <button id="runaway" style="position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);">กดฉัน</button>
    </div>`;
  const btn=document.getElementById("runaway");
  const card=document.getElementById("runawayCard");
  let caught=false;

  function moveBtn(){
    if(caught) return;
    const cw=card.offsetWidth, ch=card.offsetHeight;
    const bw=btn.offsetWidth+8, bh=btn.offsetHeight+8;
    const padTop=52;
    const maxX=Math.max(0,cw-bw);
    const maxY=Math.max(0,ch-bh-padTop);
    btn.style.left=Math.floor(Math.random()*maxX)+"px";
    btn.style.top=Math.floor(padTop+Math.random()*maxY)+"px";
    btn.style.transform="none";
  }

  btn.addEventListener("mouseenter", moveBtn);

  btn.addEventListener("touchstart", e=>{
    e.preventDefault();
    moveBtn();
  }, {passive:false});

  btn.onclick=()=>{ if(caught) return; caught=true; btn.disabled=true; unlockStage(); };
}

function fakeLoading(){
  document.getElementById("trollArea").innerHTML=`<div class="card"><h3>⏳ Processing...</h3><progress id="bar" value="0" max="100"></progress></div>`;
  let p=0, done=false;
  let t=setInterval(()=>{
    p+=Math.random();
    document.getElementById("bar").value=p;
    if(p>=100 && !done){ done=true; clearInterval(t); unlockStage(); }
  },200);
}

function generateCode(){
  const chars="1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzกขฃคฅฆงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ";
  let c=""; for(let i=0;i<15;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  currentCode=c;
}

function codeGate(){
  generateCode();
  document.getElementById("trollArea").innerHTML=`<div class="card"><h3>🔐 VERIFY CODE</h3><p>พิมพ์รหัสให้ตรง:</p><h2 style="color:#ffcc00">${currentCode}</h2><input id="codeInput"><button onclick="checkCode()">ยืนยัน</button></div>`;
}
function checkCode(){
  if(document.getElementById("codeInput").value.trim()===currentCode) unlockStage();
  else alert("❌ WRONG CODE");
}

// ── HINT SYSTEM ──
let _hintClicks = 0;

function _decodeQRaw(qRaw) {
  if (/^([0-9A-Fa-f]{2}\s)+[0-9A-Fa-f]{2}$/.test(qRaw.trim())) {
    try { return qRaw.trim().split(/\s+/).map(h=>String.fromCharCode(parseInt(h,16))).join(''); } catch(e){}
  }
  if (/^([01]{8}\s)+[01]{8}$/.test(qRaw.trim())) {
    try { return qRaw.trim().split(/\s+/).map(b=>String.fromCharCode(parseInt(b,2))).join(''); } catch(e){}
  }
  try { const dec=atob(qRaw.trim()); if(/^[\x20-\x7E]+$/.test(dec)) return dec; } catch(e){}
  for(let shift=1;shift<=25;shift++){
    const dec=qRaw.split('').map(c=>{
      if(c>='A'&&c<='Z') return String.fromCharCode(((c.charCodeAt(0)-65-shift+26)%26)+65);
      if(c>='a'&&c<='z') return String.fromCharCode(((c.charCodeAt(0)-97-shift+26)%26)+97);
      return c;
    }).join('');
    if(/^[A-Za-z0-9 ]+$/.test(dec)&&dec!==qRaw) return dec+" (ROT-"+shift+")";
  }
  return qRaw;
}

function _resetHint(){
  _hintClicks=0;
  const cnt=document.getElementById('hintCount');
  const bar=document.getElementById('hintProgress');
  const res=document.getElementById('hintResult');
  const btn=document.getElementById('hintBtn');
  const lbl=document.getElementById('hintBtnLabel');
  if(cnt) cnt.textContent='0';
  if(bar) bar.style.width='0%';
  if(res) res.style.display='none';
  if(btn){btn.disabled=false;btn.style.color='#8bb4e8';}
  if(lbl) lbl.innerHTML='💡 คลิก 100 ครั้งเพื่อดู Hint (<span id="hintCount">0</span>/100)';
}

function hintClick(){
  if(current>=_S.length) return;
  _hintClicks++;
  const cnt=document.getElementById('hintCount');
  const bar=document.getElementById('hintProgress');
  const btn=document.getElementById('hintBtn');
  const res=document.getElementById('hintResult');
  const lbl=document.getElementById('hintBtnLabel');
  if(cnt) cnt.textContent=Math.min(_hintClicks,100);
  if(bar) bar.style.width=Math.min(_hintClicks,100)+'%';
  if(_hintClicks>=100){
    const decoded=_decodeQRaw(_S[current].qRaw);
    if(res) res.style.display='block';
    const ht=document.getElementById('hintText');
    if(ht) ht.textContent=decoded;
    if(btn){btn.disabled=true;btn.style.color='#3fb950';}
    if(lbl) lbl.textContent='✅ Hint ปลดล็อกแล้ว!';
  }
}

renderQuestion(); updateClues();
</body>
</html>
