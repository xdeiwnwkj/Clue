<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f3f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    padding:35px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    width:350px;
}

h2{
    margin-top:0;
}

#countdown{
    margin:20px 0;
    font-size:20px;
    font-weight:bold;
    color:#d93025;
}

button{
    padding:12px 30px;
    font-size:16px;
    border:none;
    border-radius:5px;
    background:#1a73e8;
    color:#fff;
    cursor:pointer;
}

button:hover{
    background:#1557b0;
}

small{
    display:block;
    margin-top:15px;
    color:#666;
}
</style>
</head>

<body>

<div class="container">
    <h2>Download File</h2>

    <div id="countdown">Loading...</div>

    <button id="download">Download</button>

    <small>Available until <b>10 July 2026</b></small>
</div>

<script>
// Google Drive File
const p1 = "https://docs.google.com/";
const p2 = "uc?export=download&id=";
const id = "195wbg5oddX7UBHJ1zGZmEeTVFRwv2WwI";

// Expiry Date
const expiry = new Date("2026-07-10T23:59:59");

document.getElementById("download").onclick = function () {
    if (new Date() < expiry) {
        window.location.href = p1 + p2 + id;
    }
};

function updateCountdown() {

    const now = new Date();
    const diff = expiry - now;

    if (diff <= 0) {
        // Make page completely blank after expiry
        document.documentElement.innerHTML = "";
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerHTML =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
